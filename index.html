<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Suivi de carrière</title>
<meta name="description" content="Suivi de carrière joueurs, année par année : niveau, potentiel, matchs, buts, passes décisives, notes." />
<meta name="theme-color" content="#0B1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Carrière" />
<link id="manifest-link" rel="manifest" href="" />
<link id="apple-icon-link" rel="apple-touch-icon" href="" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#0B1220; --card:#111C33; --card-border:#1E2A44; --input-border:#263452;
    --text:#EAF0FB; --text-secondary:#8B96AE; --text-muted:#5A6884;
    --green:#33C97E; --green-dark:#16321F; --green-border:#2C6E4F;
    --gold:#F2B807; --gold-dark:#332B10;
    --red:#E2504A; --red-dark:#33131A;
    --blue:#4FA8E8;
    --head:#0E2A20;
    --row-alt:#0E1730;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  input,select,button{font-family:'Inter',sans-serif;}
  button{cursor:pointer;}
  ::placeholder{color:var(--text-muted);}
  #root{max-width:920px;margin:0 auto;padding:20px 12px 60px;}

  .top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .app-title{font-family:'Teko',sans-serif;font-size:24px;font-weight:600;line-height:1;}
  .app-sub{font-size:11px;color:var(--text-secondary);}

  .tab-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .tab-row::-webkit-scrollbar{height:6px;}
  .tab-row::-webkit-scrollbar-thumb{background:#263452;border-radius:4px;}
  .tab{background:transparent;border:1px solid var(--card-border);color:var(--text-secondary);padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap;}
  .tab.active{background:var(--green-dark);border-color:var(--green-border);color:var(--green);}
  .tab-add{background:transparent;border:1px dashed #2C3A5A;color:var(--text-muted);padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap;}

  .player-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .player-name-input{background:transparent;border:none;color:var(--text);font-family:'Teko',sans-serif;font-size:20px;font-weight:600;outline:none;padding:2px 0;min-width:140px;flex:1;}
  .link-btn{background:transparent;border:none;color:var(--text-secondary);font-size:12px;text-decoration:underline;padding:0;}

  .table-wrap{overflow-x:auto;border:1px solid var(--card-border);border-radius:10px;background:var(--card);}
  table{border-collapse:collapse;width:100%;min-width:620px;font-size:11px;}
  thead th{background:var(--head);color:var(--green);font-size:9px;text-transform:uppercase;letter-spacing:0.3px;font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--green-border);white-space:nowrap;position:sticky;top:0;}
  tbody tr:nth-child(even){background:var(--row-alt);}
  tbody td{padding:1px 3px;border-bottom:1px solid var(--card-border);vertical-align:middle;}
  tfoot td{padding:6px 4px;font-size:11px;font-weight:700;border-top:2px solid var(--green-border);background:var(--green-dark);color:var(--text);}
  .cell-input{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--text);padding:4px 4px;font-size:11px;outline:none;}
  .cell-input:hover{border-color:var(--input-border);}
  .cell-input:focus{border-color:var(--green-border);background:var(--bg);}
  .cell-input.num{font-family:'JetBrains Mono',monospace;text-align:right;}
  th.col-annee,td.col-annee{width:52px;}
  th.col-club,td.col-club{width:120px;}
  th.col-niveau,td.col-niveau,th.col-matchs,td.col-matchs,th.col-buts,td.col-buts,th.col-pd,td.col-pd,th.col-note,td.col-note{width:38px;}
  th.col-potentiel,td.col-potentiel{width:56px;}
  th.col-titre,td.col-titre{width:110px;}
  th.col-objectif,td.col-objectif{width:46px;}
  .del-cell{width:20px;text-align:center;}
  .del-btn{background:transparent;border:none;color:var(--text-muted);font-size:15px;line-height:1;padding:2px 2px;}
  .del-btn:hover{color:var(--red);}
  .note-cell{font-weight:700;font-family:'JetBrains Mono',monospace;}

  .add-row-bar{padding:8px;}
  .add-btn{background:var(--green-dark);border:1px solid var(--green-border);color:var(--green);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;}

  .career-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 14px;}
  .summary-item{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px;}
  .summary-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}
  .summary-label{font-size:9px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.4px;margin-top:1px;}

  .install-bar{position:sticky;top:0;background:var(--green-dark);border-bottom:1px solid var(--green-border);color:var(--green);font-size:13px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:40;}
  .install-bar button{background:var(--green);border:none;color:#08130D;font-weight:600;padding:6px 12px;border-radius:6px;font-size:12px;}
  .hidden{display:none !important;}
  .empty-state{color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div id="install-bar" class="install-bar hidden">
  <span>Installe cette appli pour un accès rapide hors ligne.</span>
  <button id="install-btn">Installer</button>
</div>
<div id="root"></div>

<script>
/* ---------- Utils ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const emptyYear = () => ({ id: uid(), age:"", club:"", niveau:"", potentiel:"", matches:"", buts:"", pd:"", note:"", titre:"", objectif:"" });
const emptyPlayer = (n) => ({ id: uid(), name: n || "Nouveau joueur", years: [emptyYear()] });

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(){ localStorage.setItem('fifaCareerPlayers', JSON.stringify(state.players)); }

function num(v){ const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function fmtNote(n){ return n.toFixed(2).replace('.', ','); }

/* ---------- State ---------- */
const state = {
  players: loadJSON('fifaCareerPlayers', [emptyPlayer("Joueur 1")]),
  playerId: null,
};
if(!state.players.length) state.players = [emptyPlayer("Joueur 1")];
state.playerId = state.players[0].id;

function currentPlayer(){ return state.players.find(p => p.id === state.playerId) || state.players[0]; }

function totals(years){
  let matches=0, buts=0, pd=0, weighted=0;
  years.forEach(y => {
    const m = num(y.matches);
    matches += m; buts += num(y.buts); pd += num(y.pd);
    weighted += num(y.note) * m;
  });
  const avgNote = matches ? weighted / matches : 0;
  return { matches, buts, pd, avgNote };
}

/* ---------- Render ---------- */
function render(){
  const root = document.getElementById('root');
  const player = currentPlayer();
  const t = totals(player.years);

  root.innerHTML = `
    <div class="top-row">
      <div>
        <div class="app-title">Suivi de carrière</div>
        <div class="app-sub">Progression année par année</div>
      </div>
    </div>

    <div class="tab-row">
      ${state.players.map(p => `<button class="tab ${p.id===state.playerId?'active':''}" data-action="select-player" data-id="${p.id}">${esc(p.name)}</button>`).join("")}
      <button class="tab-add" data-action="add-player">+ joueur</button>
    </div>

    <div class="player-header">
      <input class="player-name-input" id="player-name-input" value="${esc(player.name)}" />
      ${state.players.length>1 ? `<button class="link-btn" data-action="delete-player">Supprimer ce joueur</button>` : ""}
    </div>

    <div class="career-summary">
      ${summary("Années", player.years.length)}
      ${summary("Matchs", t.matches)}
      ${summary("Buts", t.buts, "var(--green)")}
      ${summary("PD", t.pd, "var(--blue)")}
      ${summary("Note moy.", t.matches ? fmtNote(t.avgNote) : "-", "var(--gold)")}
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-annee">Année</th>
            <th class="col-club">Club</th>
            <th class="col-niveau">Niveau</th>
            <th class="col-potentiel">Potentiel</th>
            <th class="col-matchs">Matchs</th>
            <th class="col-buts">Buts</th>
            <th class="col-pd">PD</th>
            <th class="col-note">Note</th>
            <th class="col-titre">Titre</th>
            <th class="col-objectif">Objectif</th>
            <th class="del-cell"></th>
          </tr>
        </thead>
        <tbody>
          ${player.years.length ? player.years.map(yearRow).join("") : `<tr><td colspan="11" class="empty-state">Aucune année enregistrée.</td></tr>`}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">TOTAL</td>
            <td>${t.matches}</td>
            <td>${t.buts}</td>
            <td>${t.pd}</td>
            <td>${t.matches ? fmtNote(t.avgNote) : "-"}</td>
            <td colspan="3"></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="add-row-bar">
      <button class="add-btn" data-action="add-year">+ Ajouter une année</button>
    </div>
  `;

  attachEvents();
}

function summary(label, value, accent){
  return `<div class="summary-item">
    <div class="summary-value" style="color:${accent || 'var(--text)'}">${esc(value)}</div>
    <div class="summary-label">${esc(label)}</div>
  </div>`;
}

function yearRow(y){
  return `<tr data-year-id="${y.id}">
    <td class="col-annee"><input class="cell-input" data-field="age" value="${esc(y.age)}" placeholder="16 ans" /></td>
    <td class="col-club"><input class="cell-input" data-field="club" value="${esc(y.club)}" placeholder="Nom du club (pays)" /></td>
    <td class="col-niveau"><input class="cell-input num" data-field="niveau" value="${esc(y.niveau)}" placeholder="0" /></td>
    <td class="col-potentiel"><input class="cell-input" data-field="potentiel" value="${esc(y.potentiel)}" placeholder="50 +5" /></td>
    <td class="col-matchs"><input class="cell-input num" type="number" min="0" data-field="matches" value="${esc(y.matches)}" placeholder="0" /></td>
    <td class="col-buts"><input class="cell-input num" type="number" min="0" data-field="buts" value="${esc(y.buts)}" placeholder="0" /></td>
    <td class="col-pd"><input class="cell-input num" type="number" min="0" data-field="pd" value="${esc(y.pd)}" placeholder="0" /></td>
    <td class="col-note note-cell" style="color:${ratingColor(num(y.note))}"><input class="cell-input num" type="number" min="0" max="10" step="0.1" data-field="note" value="${esc(y.note)}" placeholder="0" /></td>
    <td class="col-titre"><input class="cell-input" data-field="titre" value="${esc(y.titre)}" placeholder="—" /></td>
    <td class="col-objectif"><input class="cell-input" data-field="objectif" value="${esc(y.objectif)}" placeholder="0/4" /></td>
    <td class="del-cell"><button class="del-btn" data-action="delete-year" data-id="${y.id}" aria-label="Supprimer l'année">×</button></td>
  </tr>`;
}

function ratingColor(r){
  if(!r) return "var(--text)";
  if(r>=8.5) return "var(--gold)";
  if(r>=7) return "var(--green)";
  if(r>=6) return "var(--text-secondary)";
  return "var(--red)";
}

function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Events ---------- */
function attachEvents(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-action="select-player"]').forEach(el => {
    el.addEventListener('click', () => { state.playerId = el.dataset.id; render(); });
  });
  const addPlayerBtn = root.querySelector('[data-action="add-player"]');
  if(addPlayerBtn) addPlayerBtn.addEventListener('click', () => {
    const p = emptyPlayer(`Joueur ${state.players.length+1}`);
    state.players.push(p); state.playerId = p.id; save(); render();
  });
  const delPlayerBtn = root.querySelector('[data-action="delete-player"]');
  if(delPlayerBtn) delPlayerBtn.addEventListener('click', () => {
    if(state.players.length<=1) return;
    state.players = state.players.filter(p => p.id !== state.playerId);
    state.playerId = state.players[0].id; save(); render();
  });
  const nameInput = root.querySelector('#player-name-input');
  if(nameInput) nameInput.addEventListener('change', () => {
    const p = currentPlayer(); p.name = nameInput.value || p.name; save();
  });

  const addYearBtn = root.querySelector('[data-action="add-year"]');
  if(addYearBtn) addYearBtn.addEventListener('click', () => {
    currentPlayer().years.push(emptyYear()); save(); render();
  });

  root.querySelectorAll('tbody tr[data-year-id]').forEach(tr => {
    const yearId = tr.dataset.yearId;
    const year = currentPlayer().years.find(y => y.id === yearId);
    tr.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('change', () => {
        year[inp.dataset.field] = inp.value;
        save();
        if(inp.dataset.field === 'matches' || inp.dataset.field === 'note'){
          render();
        }
      });
    });
  });

  root.querySelectorAll('[data-action="delete-year"]').forEach(el => {
    el.addEventListener('click', () => {
      const p = currentPlayer();
      p.years = p.years.filter(y => y.id !== el.dataset.id);
      save(); render();
    });
  });
}

render();

/* ---------- PWA: manifest + service worker (inline, no extra files) ---------- */
const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#0B1220"/>
  <polygon points="100,20 180,55 180,130 100,180 20,130 20,55" fill="#14213D" stroke="#2C6E4F" stroke-width="6"/>
  <text x="100" y="112" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#F2B807" text-anchor="middle">C</text>
</svg>`;
const iconDataUri = "data:image/svg+xml;base64," + btoa(iconSvg);

const manifest = {
  name: "Suivi de carrière",
  short_name: "Carrière",
  description: "Suivi de carrière joueurs, année par année.",
  start_url: ".",
  scope: ".",
  display: "standalone",
  background_color: "#0B1220",
  theme_color: "#0B1220",
  icons: [
    { src: iconDataUri, sizes: "192x192", type: "image/svg+xml" },
    { src: iconDataUri, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" },
  ],
};
const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
document.getElementById('apple-icon-link').href = iconDataUri;

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const swSource = `
    const CACHE = 'carriere-v2';
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope)));
    });
    self.addEventListener('activate', e => { self.clients.claim(); });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return res;
        }).catch(() => cached))
      );
    });
  `;
  const swBlob = new Blob([swSource], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-bar').classList.remove('hidden');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-bar').classList.add('hidden');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-bar').classList.add('hidden');
});
</script>
</body>
</html>
