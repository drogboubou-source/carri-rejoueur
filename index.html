<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Plan de carrière</title>
<meta name="description" content="Plan de carrière joueur : progression, rêves et objectifs, règles de carrière." />
<meta name="theme-color" content="#0B1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Carrière" />
<link id="manifest-link" rel="manifest" href="" />
<link id="apple-icon-link" rel="apple-touch-icon" href="" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#0B1220; --panel:#101B33; --panel2:#0D1730; --border:#1E2A44; --input-border:#263452;
    --text:#EAF0FB; --text-secondary:#8B96AE; --text-muted:#5A6884;
    --blue:#3B82F6; --blue-dark:#122A4E;
    --red:#E2504A; --red-dark:#3A1414;
    --gold:#F2B807; --gold-dark:#332B10;
    --pink:#D4537E; --pink-dark:#3A1A28;
    --purple:#7F77DD; --purple-dark:#221E42;
    --green:#33C97E; --green-dark:#16321F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  input,select,button,textarea{font-family:'Inter',sans-serif;}
  button{cursor:pointer;}
  ::placeholder{color:var(--text-muted);}
  #root{max-width:1180px;margin:0 auto;padding:16px 12px 60px;}

  .tab-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .tab-row::-webkit-scrollbar{height:6px;}
  .tab{background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap;}
  .tab.active{background:var(--blue-dark);border-color:var(--blue);color:#9CC1FF;}
  .tab-add{background:transparent;border:1px dashed #2C3A5A;color:var(--text-muted);padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap;}
  .link-btn{background:transparent;border:none;color:var(--text-secondary);font-size:11px;text-decoration:underline;padding:0;}

  /* HERO BANNER */
  .banner{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--border);background:linear-gradient(120deg,#0C1730 0%,#0E1A38 45%,#170F1C 100%);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:118px;}
  .banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(59,130,246,0.14), transparent 40%, rgba(226,80,74,0.14));pointer-events:none;z-index:0;}
  .banner.has-photo{padding-left:120px;}
  .photo-bleed{position:absolute;left:14px;top:14px;width:90px;height:90px;border-radius:12px;overflow:hidden;z-index:1;box-shadow:0 0 0 1.5px var(--border);}
  .photo-bleed img{width:100%;height:100%;object-fit:cover;object-position:top center;filter:saturate(1.05) contrast(1.03);}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--red));display:flex;align-items:center;justify-content:center;font-family:'Teko',sans-serif;font-size:26px;font-weight:600;color:#fff;flex-shrink:0;position:relative;z-index:1;}
  .banner-mid{flex:1;min-width:200px;position:relative;z-index:1;}
  .photo-field{margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;}
  .photo-upload-btn{background:var(--blue-dark);border:1px solid var(--blue);color:#9CC1FF;font-size:11px;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-block;}
  .photo-upload-btn:hover{background:#173a68;}
  .player-name{font-family:'Teko',sans-serif;font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;background:linear-gradient(90deg,#EAF0FB 0%,#9CC1FF 45%,#F0908B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0.5px;border:none;outline:none;width:100%;padding:2px 0;}
  .name-sub{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap;}
  .name-sub-text{font-size:12px;color:var(--text-secondary);}
  .mode-pill{background:var(--blue-dark);border:1px solid var(--blue);color:#9CC1FF;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:0.5px;}

  .club-track{display:flex;align-items:center;gap:10px;position:relative;z-index:1;flex-wrap:wrap;}
  .club-badge{display:flex;align-items:center;gap:8px;}
  .club-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Teko',sans-serif;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;}
  .club-circle.blue{background:var(--blue-dark);border:1.5px solid var(--blue);color:#9CC1FF;}
  .club-circle.red{background:var(--red-dark);border:1.5px solid var(--red);color:#F0908B;}
  .club-text-input{background:transparent;border:none;color:var(--text);font-size:13px;font-weight:500;outline:none;width:120px;}
  .league-text-input{background:transparent;border:none;color:var(--text-secondary);font-size:10px;outline:none;width:120px;text-transform:uppercase;letter-spacing:0.3px;}
  .club-arrow{color:var(--text-muted);font-size:16px;}

  /* MAIN GRID */
  .main-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;align-items:start;}
  @media (max-width:820px){ .main-grid{grid-template-columns:1fr;} }

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .card-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);}
  .card-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
  .card-body{padding:10px 12px;}

  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:11px;}
  thead th{background:#0B1730;color:#9CC1FF;font-size:9px;text-transform:uppercase;letter-spacing:0.3px;font-weight:600;text-align:center;padding:6px 3px;border-bottom:1px solid var(--blue);white-space:nowrap;}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
  tbody td{padding:1px 2px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:center;}
  tfoot td{padding:6px 4px;font-size:11px;font-weight:700;border-top:2px solid var(--blue);background:var(--blue-dark);color:var(--text);text-align:center;}
  .cell-input{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--text);padding:4px 3px;font-size:11px;outline:none;text-align:center;}
  .cell-input:hover{border-color:var(--input-border);}
  .cell-input:focus{border-color:var(--blue);background:var(--bg);}
  .cell-input.mono{font-family:'JetBrains Mono',monospace;}
  .pot-pair{display:flex;gap:2px;}
  .pot-pair input:first-child{flex:1.3;}
  .pot-pair input:last-child{flex:1;color:var(--gold);}
  th.col-age,td.col-age{width:40px;}
  th.col-club,td.col-club{width:110px;}
  th.col-niveau,td.col-niveau,th.col-matchs,td.col-matchs,th.col-buts,td.col-buts,th.col-pd,td.col-pd,th.col-note,td.col-note{width:34px;}
  th.col-pot,td.col-pot{width:62px;}
  th.col-obj,td.col-obj{width:42px;}
  th.col-contrat,td.col-contrat{width:44px;}
  .del-cell{width:18px;}
  .del-btn{background:transparent;border:none;color:var(--text-muted);font-size:14px;line-height:1;padding:2px;}
  .del-btn:hover{color:var(--red);}
  .note-cell input{font-weight:700;}
  .add-row-bar{padding:8px 4px 2px;}
  .add-btn{background:var(--blue-dark);border:1px solid var(--blue);color:#9CC1FF;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;}

  .career-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .summary-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;text-align:center;min-width:56px;}
  .summary-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
  .summary-label{font-size:8px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.3px;}

  /* GOALS PANEL */
  .goal-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .goal-row:last-of-type{border-bottom:none;}
  .goal-icon{width:22px;height:22px;flex-shrink:0;color:var(--gold);margin-top:2px;}
  .goal-text{flex:1;background:transparent;border:none;color:var(--text);font-size:12.5px;line-height:1.5;outline:none;resize:none;width:100%;font-family:'Inter',sans-serif;}
  .goal-del{background:transparent;border:none;color:var(--text-muted);font-size:14px;flex-shrink:0;}
  .goal-del:hover{color:var(--red);}
  .add-goal-btn{margin-top:8px;background:transparent;border:1px dashed #2C3A5A;color:var(--text-muted);padding:6px 10px;border-radius:8px;font-size:11px;width:100%;}

  /* REFERENCE CARDS */
  .ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
  @media (max-width:820px){ .ref-grid{grid-template-columns:1fr;} }
  .ref-grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:12px;}
  @media (max-width:820px){ .ref-grid2{grid-template-columns:1fr;} }
  .ref-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11.5px;}
  .ref-row:last-child{border-bottom:none;}
  .ref-label{color:var(--text-secondary);}
  .ref-value{color:var(--text);font-weight:500;text-align:right;}
  .ref-value.pos{color:var(--green);font-family:'JetBrains Mono',monospace;font-weight:700;}
  .ref-value.neg{color:var(--red);font-family:'JetBrains Mono',monospace;font-weight:700;}

  .skill-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .skill-col{flex:1;}
  .skill-col-title{font-size:9px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;}
  .skill-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .skill-chip{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--purple);color:#C9C5F5;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-align:center;line-height:1.1;}
  .skill-note{font-size:10px;color:var(--text-muted);margin-top:6px;}

  .footer-tag{text-align:center;font-family:'Teko',sans-serif;font-size:16px;letter-spacing:1px;color:var(--text-secondary);margin-top:16px;}

  .install-bar{position:sticky;top:0;background:var(--blue-dark);border-bottom:1px solid var(--blue);color:#9CC1FF;font-size:13px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:40;}
  .install-bar button{background:var(--blue);border:none;color:#fff;font-weight:600;padding:6px 12px;border-radius:6px;font-size:12px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="install-bar" class="install-bar hidden">
  <span>Installe cette appli pour un accès rapide hors ligne.</span>
  <button id="install-btn">Installer</button>
</div>
<div id="root"></div>

<script>
/* ---------- Utils ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const emptyYear = () => ({ id: uid(), age:"", club:"", niveau:"", potentiel:"", potentielDelta:"", matches:"", buts:"", pd:"", note:"", objectif:"", contrat:"" });
const emptyGoal = (t) => ({ id: uid(), text: t || "" });
const emptyPlayer = (n) => ({
  id: uid(), name: n || "Nouveau joueur",
  currentClub:"", currentLeague:"", dreamClub:"", dreamLeague:"",
  goals: [emptyGoal("Rêve ultime : être recruté par un grand club")],
  years: [emptyYear()],
});

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(){ localStorage.setItem('fifaCareerPlayersV2', JSON.stringify(state.players)); }

function migrateOld(){
  const old = loadJSON('fifaCareerPlayers', null);
  if(!old || !old.length) return null;
  return old.map(p => ({
    id: p.id || uid(),
    name: p.name || "Joueur",
    currentClub:"", currentLeague:"", dreamClub:"", dreamLeague:"",
    goals: [emptyGoal("Rêve ultime : être recruté par un grand club")],
    years: (p.years||[]).map(y => ({
      id: y.id || uid(), age: y.age||"", club: y.club||"", niveau: y.niveau||"",
      potentiel: y.potentiel||"", potentielDelta:"", matches: y.matches||"",
      buts: y.buts||"", pd: y.pd||"", note: y.note||"", objectif: y.objectif||"", contrat:"",
    })),
  }));
}

function num(v){ const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function fmtNote(n){ return n.toFixed(2).replace('.', ','); }
function initials(name){
  const parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const PHOTO_EXTS = ['jpg','jpeg','webp','JPG','PNG'];
function handlePhotoError(img){
  const idx = parseInt(img.dataset.extIdx || '0', 10);
  if(idx < PHOTO_EXTS.length){
    img.dataset.extIdx = String(idx + 1);
    img.src = img.dataset.base + '.' + PHOTO_EXTS[idx];
  } else {
    const banner = img.closest('.banner');
    banner.classList.remove('has-photo');
    img.closest('.photo-bleed').style.display = 'none';
    const fb = banner.querySelector('.avatar-fallback');
    if(fb) fb.style.display = 'flex';
  }
}

/* ---------- State ---------- */
const state = {
  players: loadJSON('fifaCareerPlayersV2', null) || migrateOld() || [emptyPlayer("Joueur 1")],
  playerId: null,
};
if(!state.players.length) state.players = [emptyPlayer("Joueur 1")];
state.playerId = state.players[0].id;
save();

function currentPlayer(){ return state.players.find(p => p.id === state.playerId) || state.players[0]; }

function totals(years){
  let matches=0, buts=0, pd=0, weighted=0;
  years.forEach(y => {
    const m = num(y.matches);
    matches += m; buts += num(y.buts); pd += num(y.pd);
    weighted += num(y.note) * m;
  });
  const avgNote = matches ? weighted / matches : 0;
  return { matches, buts, pd, avgNote };
}

/* ---------- Static reference data ---------- */
const POTENTIAL_RULES = [
  ["Moins de 5", "-5 de potentiel", "neg"],
  ["5 à 5.50", "-3 de potentiel", "neg"],
  ["5.51 à 6", "0 point de potentiel", ""],
  ["6.1 à 6.6", "+2 points de potentiel", "pos"],
  ["6.7 à 6.8", "+3 points de potentiel", "pos"],
  ["6.81 à 6.99", "+4 points de potentiel", "pos"],
  ["7 ou plus", "+5 points de potentiel", "pos"],
];
const TRAINING_RULES = [
  ["Objectif 0", "1 entraînement"],
  ["Objectif 1", "2 entraînements"],
  ["Objectif 2", "3 entraînements"],
  ["Objectif 3", "4 entraînements"],
  ["Objectif 4", "5 entraînements"],
];
const TRANSFER_RULES = [
  ["0 / 0.5 objectif", "Prêt ou transfert obligatoire, club moins fort · 1 demande = 1 club"],
  ["1 objectif", "Prêt ou transfert, club moins fort · 2 demandes = 2 clubs"],
  ["2 objectif", "Prêt ou transfert, club égal · 3 demandes = 3 clubs"],
  ["2.5 / 3 objectif", "Prolongation ou départ, club égal · 4 demandes = 4 clubs"],
  ["3.5 / 4 objectif", "Prolongation ou départ, club plus huppé · 5 demandes = 5 clubs"],
];
const BONUS_RULES = [
  ["Champion", "+2", "pos"],
  ["Promotion", "+1", "pos"],
  ["Première sélection pays", "+2", "pos"],
  ["Coupe pays", "+4", "pos"],
  ["Coupe nationale (club)", "+1", "pos"],
  ["Coupe continentale — LDC", "+3", "pos"],
  ["Coupe continentale — Europa", "+2", "pos"],
  ["Coupe continentale — Conférence", "+1", "pos"],
  ["Meilleur buteur / passeur championnat", "+1", "pos"],
  ["Deuxième buteur / passeur", "+0.5", "pos"],
  ["Joueur de l'année", "+1", "pos"],
  ["Objectif global atteint", "+0.5", "pos"],
  ["Relégation", "-1", "neg"],
  ["Derniers du classement", "-2", "neg"],
  ["Carton rouge / jaune", "-0.5", "neg"],
];

/* ---------- Render ---------- */
function render(){
  const root = document.getElementById('root');
  const player = currentPlayer();
  const playerIndex = state.players.findIndex(p => p.id === player.id);
  const t = totals(player.years);

  root.innerHTML = `
    <div class="tab-row">
      ${state.players.map(p => `<button class="tab ${p.id===state.playerId?'active':''}" data-action="select-player" data-id="${p.id}">${esc(p.name)}</button>`).join("")}
      <button class="tab-add" data-action="add-player">+ joueur</button>
    </div>

    <div class="banner has-photo" id="player-banner">
      <div class="photo-bleed">
        <img id="player-photo-img" data-base="images/joueur-${playerIndex+1}" data-ext-idx="0" src="images/joueur-${playerIndex+1}.png" alt="Photo de ${esc(player.name)}" onerror="handlePhotoError(this)" />
      </div>
      <div class="avatar avatar-fallback" style="display:none">${esc(initials(player.name))}</div>
      <div class="banner-mid">
        <input class="player-name" id="player-name-input" value="${esc(player.name)}" />
        <div class="name-sub">
          <span class="name-sub-text">Plan de carrière du joueur</span>
          <span class="mode-pill">Mode RP</span>
          ${state.players.length>1 ? `<button class="link-btn" data-action="delete-player">Supprimer ce joueur</button>` : ""}
        </div>
      </div>
      <div class="club-track">
        <div class="club-badge">
          <div class="club-circle blue">${esc(initials(player.currentClub || "?"))}</div>
          <div>
            <input class="club-text-input" id="current-club-input" value="${esc(player.currentClub)}" placeholder="Club actuel" />
            <br/>
            <input class="league-text-input" id="current-league-input" value="${esc(player.currentLeague)}" placeholder="Championnat" />
          </div>
        </div>
        <span class="club-arrow">→</span>
        <div class="club-badge">
          <div class="club-circle red">${esc(initials(player.dreamClub || "?"))}</div>
          <div>
            <input class="club-text-input" id="dream-club-input" value="${esc(player.dreamClub)}" placeholder="Club rêvé" />
            <br/>
            <input class="league-text-input" id="dream-league-input" value="${esc(player.dreamLeague)}" placeholder="Championnat" />
          </div>
        </div>
      </div>
    </div>

    <div class="main-grid">
      <div class="card">
        <div class="card-head"><span class="dot" style="background:var(--blue)"></span><span class="card-title">Plan de carrière</span></div>
        <div class="card-body">
          <div class="career-summary">
            ${summary("Années", player.years.length)}
            ${summary("Matchs", t.matches)}
            ${summary("Buts", t.buts, "var(--green)")}
            ${summary("PD", t.pd, "#9CC1FF")}
            ${summary("Note moy.", t.matches ? fmtNote(t.avgNote) : "-", "var(--gold)")}
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="col-age">Âge</th>
                  <th class="col-club">Club</th>
                  <th class="col-niveau">Niv.</th>
                  <th class="col-pot">Potentiel / +-</th>
                  <th class="col-matchs">Matchs</th>
                  <th class="col-buts">Buts</th>
                  <th class="col-pd">PD</th>
                  <th class="col-note">Note</th>
                  <th class="col-obj">Objectif</th>
                  <th class="col-contrat">Contrat</th>
                  <th class="del-cell"></th>
                </tr>
              </thead>
              <tbody>
                ${player.years.length ? player.years.map(yearRow).join("") : `<tr><td colspan="11" style="padding:16px;color:var(--text-muted)">Aucune année enregistrée.</td></tr>`}
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="4">TOTAL</td>
                  <td>${t.matches}</td>
                  <td>${t.buts}</td>
                  <td>${t.pd}</td>
                  <td>${t.matches ? fmtNote(t.avgNote) : "-"}</td>
                  <td colspan="3"></td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="add-row-bar"><button class="add-btn" data-action="add-year">+ Ajouter une année</button></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="dot" style="background:var(--gold)"></span><span class="card-title">Rêves &amp; objectifs ultimes</span></div>
        <div class="card-body">
          ${player.goals.map(goalRow).join("")}
          <button class="add-goal-btn" data-action="add-goal">+ Ajouter un rêve</button>
        </div>
      </div>
    </div>

    <div class="ref-grid">
      ${refCard("var(--blue)", "Évolution du potentiel", POTENTIAL_RULES.map(r => refRow(r[0], r[1], r[2])).join(""))}
      ${refCard("var(--blue)", "Objectif entraînement", TRAINING_RULES.map(r => refRow(r[0], r[1])).join(""))}
      ${refCard("var(--pink)", "Contrat &amp; transfert", TRANSFER_RULES.map(r => `<div class="ref-row" style="align-items:flex-start"><span class="ref-label" style="min-width:100px">${esc(r[0])}</span><span class="ref-value" style="font-size:11px">${esc(r[1])}</span></div>`).join(""))}
    </div>

    <div class="ref-grid2">
      ${refCard("var(--gold)", "Bonus &amp; malus de carrière", BONUS_RULES.map(r => refRow(r[0], r[1], r[2])).join(""))}
      <div class="card">
        <div class="card-head"><span class="dot" style="background:var(--purple)"></span><span class="card-title">Compétences &amp; développement</span></div>
        <div class="card-body">
          <div class="skill-row">
            <div class="skill-col">
              <div class="skill-col-title">Geste technique</div>
              <div class="skill-chips">
                <div class="skill-chip">60<br/>(2)</div>
                <div class="skill-chip">70<br/>(3)</div>
                <div class="skill-chip">80<br/>(4)</div>
                <div class="skill-chip">90<br/>(5)</div>
              </div>
              <div class="skill-note">Pareil pour le mauvais pied</div>
            </div>
            <div class="skill-col">
              <div class="skill-col-title">Archétype</div>
              <div class="skill-chips">
                <div class="skill-chip">⚡</div>
                <div class="skill-chip">🎯</div>
                <div class="skill-chip">🛡</div>
                <div class="skill-chip">🧠</div>
              </div>
              <div class="skill-note">Pareil pour les archétypes</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-tag">★ Des rêves, des efforts, des résultats ! ★</div>
  `;

  attachEvents();
}

function summary(label, value, accent){
  return `<div class="summary-item">
    <div class="summary-value" style="color:${accent || 'var(--text)'}">${esc(value)}</div>
    <div class="summary-label">${esc(label)}</div>
  </div>`;
}

function refCard(color, title, rowsHtml){
  return `<div class="card">
    <div class="card-head"><span class="dot" style="background:${color}"></span><span class="card-title">${title}</span></div>
    <div class="card-body">${rowsHtml}</div>
  </div>`;
}
function refRow(label, value, cls){
  return `<div class="ref-row"><span class="ref-label">${esc(label)}</span><span class="ref-value ${cls||''}">${esc(value)}</span></div>`;
}

function goalRow(g){
  return `<div class="goal-row" data-goal-id="${g.id}">
    <svg class="goal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l2.9 6.26L21.5 9l-5 4.7L17.8 21 12 17.4 6.2 21l1.3-7.3-5-4.7 6.6-.74L12 2z"/></svg>
    <textarea class="goal-text" data-field="goal-text" rows="2">${esc(g.text)}</textarea>
    <button class="goal-del" data-action="delete-goal" data-id="${g.id}" aria-label="Supprimer">×</button>
  </div>`;
}

function yearRow(y){
  return `<tr data-year-id="${y.id}">
    <td class="col-age"><input class="cell-input" data-field="age" value="${esc(y.age)}" placeholder="16" /></td>
    <td class="col-club"><input class="cell-input" style="text-align:left" data-field="club" value="${esc(y.club)}" placeholder="Club (pays)" /></td>
    <td class="col-niveau"><input class="cell-input mono" data-field="niveau" value="${esc(y.niveau)}" placeholder="-" /></td>
    <td class="col-pot"><div class="pot-pair">
      <input class="cell-input mono" data-field="potentiel" value="${esc(y.potentiel)}" placeholder="-" />
      <input class="cell-input mono" data-field="potentielDelta" value="${esc(y.potentielDelta)}" placeholder="+0" />
    </div></td>
    <td class="col-matchs"><input class="cell-input mono" type="number" min="0" data-field="matches" value="${esc(y.matches)}" placeholder="0" /></td>
    <td class="col-buts"><input class="cell-input mono" type="number" min="0" data-field="buts" value="${esc(y.buts)}" placeholder="0" /></td>
    <td class="col-pd"><input class="cell-input mono" type="number" min="0" data-field="pd" value="${esc(y.pd)}" placeholder="0" /></td>
    <td class="col-note note-cell" style="color:${ratingColor(num(y.note))}"><input class="cell-input mono" type="number" min="0" max="10" step="0.1" data-field="note" value="${esc(y.note)}" placeholder="0" /></td>
    <td class="col-obj"><input class="cell-input" data-field="objectif" value="${esc(y.objectif)}" placeholder="0/4" /></td>
    <td class="col-contrat"><input class="cell-input" data-field="contrat" value="${esc(y.contrat)}" placeholder="-" /></td>
    <td class="del-cell"><button class="del-btn" data-action="delete-year" data-id="${y.id}" aria-label="Supprimer l'année">×</button></td>
  </tr>`;
}

function ratingColor(r){
  if(!r) return "var(--text)";
  if(r>=8.5) return "var(--gold)";
  if(r>=7) return "var(--green)";
  if(r>=6) return "var(--text-secondary)";
  return "var(--red)";
}

/* ---------- Events ---------- */
function attachEvents(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-action="select-player"]').forEach(el => {
    el.addEventListener('click', () => { state.playerId = el.dataset.id; render(); });
  });
  const addPlayerBtn = root.querySelector('[data-action="add-player"]');
  if(addPlayerBtn) addPlayerBtn.addEventListener('click', () => {
    const p = emptyPlayer(`Joueur ${state.players.length+1}`);
    state.players.push(p); state.playerId = p.id; save(); render();
  });
  const delPlayerBtn = root.querySelector('[data-action="delete-player"]');
  if(delPlayerBtn) delPlayerBtn.addEventListener('click', () => {
    if(state.players.length<=1) return;
    state.players = state.players.filter(p => p.id !== state.playerId);
    state.playerId = state.players[0].id; save(); render();
  });

  const nameInput = root.querySelector('#player-name-input');
  if(nameInput) nameInput.addEventListener('change', () => { currentPlayer().name = nameInput.value || currentPlayer().name; save(); render(); });
  const ccInput = root.querySelector('#current-club-input');
  if(ccInput) ccInput.addEventListener('change', () => { currentPlayer().currentClub = ccInput.value; save(); render(); });
  const clInput = root.querySelector('#current-league-input');
  if(clInput) clInput.addEventListener('change', () => { currentPlayer().currentLeague = clInput.value; save(); });
  const dcInput = root.querySelector('#dream-club-input');
  if(dcInput) dcInput.addEventListener('change', () => { currentPlayer().dreamClub = dcInput.value; save(); render(); });
  const dlInput = root.querySelector('#dream-league-input');
  if(dlInput) dlInput.addEventListener('change', () => { currentPlayer().dreamLeague = dlInput.value; save(); });

  const addYearBtn = root.querySelector('[data-action="add-year"]');
  if(addYearBtn) addYearBtn.addEventListener('click', () => { currentPlayer().years.push(emptyYear()); save(); render(); });

  root.querySelectorAll('tbody tr[data-year-id]').forEach(tr => {
    const year = currentPlayer().years.find(y => y.id === tr.dataset.yearId);
    tr.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('change', () => {
        year[inp.dataset.field] = inp.value;
        save();
        if(inp.dataset.field === 'matches' || inp.dataset.field === 'note') render();
      });
    });
  });
  root.querySelectorAll('[data-action="delete-year"]').forEach(el => {
    el.addEventListener('click', () => {
      const p = currentPlayer();
      p.years = p.years.filter(y => y.id !== el.dataset.id);
      save(); render();
    });
  });

  const addGoalBtn = root.querySelector('[data-action="add-goal"]');
  if(addGoalBtn) addGoalBtn.addEventListener('click', () => { currentPlayer().goals.push(emptyGoal("")); save(); render(); });
  root.querySelectorAll('.goal-row').forEach(row => {
    const goal = currentPlayer().goals.find(g => g.id === row.dataset.goalId);
    const ta = row.querySelector('[data-field="goal-text"]');
    if(ta) ta.addEventListener('change', () => { goal.text = ta.value; save(); });
  });
  root.querySelectorAll('[data-action="delete-goal"]').forEach(el => {
    el.addEventListener('click', () => {
      const p = currentPlayer();
      p.goals = p.goals.filter(g => g.id !== el.dataset.id);
      save(); render();
    });
  });
}

render();

/* ---------- PWA: manifest + service worker (inline, no extra files) ---------- */
const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#0B1220"/>
  <polygon points="100,20 180,55 180,130 100,180 20,130 20,55" fill="#14213D" stroke="#3B82F6" stroke-width="6"/>
  <text x="100" y="112" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#F2B807" text-anchor="middle">C</text>
</svg>`;
const iconDataUri = "data:image/svg+xml;base64," + btoa(iconSvg);

const manifest = {
  name: "Plan de carrière",
  short_name: "Carrière",
  description: "Plan de carrière joueur, année par année.",
  start_url: ".",
  scope: ".",
  display: "standalone",
  background_color: "#0B1220",
  theme_color: "#0B1220",
  icons: [
    { src: iconDataUri, sizes: "192x192", type: "image/svg+xml" },
    { src: iconDataUri, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" },
  ],
};
const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
document.getElementById('apple-icon-link').href = iconDataUri;

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const swSource = `
    const CACHE = 'carriere-v3';
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope)));
    });
    self.addEventListener('activate', e => { self.clients.claim(); });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return res;
        }).catch(() => cached))
      );
    });
  `;
  const swBlob = new Blob([swSource], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-bar').classList.remove('hidden');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-bar').classList.add('hidden');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-bar').classList.add('hidden');
});
</script>
